name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # PyPI trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Test
        run: pytest -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with the version inside the artifact is a
        # release that ships the wrong thing. Fail loudly instead.
        run: |
          python - <<'PY'
          import glob, os, sys, zipfile

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel built")

          name = os.path.basename(wheels[0])
          if tag not in name:
              sys.exit(f"tag {tag} does not match artifact {name}")

          # The parser is only useful if the entry point survives packaging.
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              eps = [n for n in names if n.endswith("entry_points.txt")]
              if not eps or "paperless_ngx.parsers" not in z.read(eps[0]).decode():
                  sys.exit("entry point missing from the built wheel")
              if not any(n.endswith("paperless_epub_parser/_epub.py") for n in names):
                  sys.exit("_epub.py missing from the built wheel")

          print(f"{name} carries the parser entry point; tag {tag} matches")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # NOTE: no `environment:` here on purpose. If you set one, the name must
    # match the environment configured on the PyPI trusted-publisher form
    # exactly, or OIDC verification fails. Leaving it unset is the safe default.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
