[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-epub-parser"
version = "1.0.0"
description = "EPUB parser plugin for Paperless-ngx — text extraction for full-text search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Newman", email = "david.r.newman@proton.me" }]
keywords = ["paperless-ngx", "epub", "parser", "plugin", "ocr"]

# ``markitdown`` is the EPUB converter.  ``Pillow`` renders the thumbnail --
# it is already present in the Paperless-ngx image (the built-in text parser
# imports it), but a package should declare what it imports rather than
# depending on a transitive host dependency.
dependencies = [
    "markitdown>=0.1.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Paperless-ngx discovers third-party parsers by scanning this entry-point
# group at startup (paperless/parsers/registry.py).  The key on the left is
# used only in log output; the value is the ``module:ClassName`` import path.
[project.entry-points."paperless_ngx.parsers"]
epub = "paperless_epub_parser:EpubDocumentParser"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_epub_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
